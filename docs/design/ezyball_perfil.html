<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg">

<h1 class="font-headline-md text-headline-md text-primary dark:text-primary">EzyBall</h1>

<span class="material-symbols-outlined" data-icon="local_fire_department">local_fire_department</span>
</button>

<div class="absolute bottom-0 right-0 bg-primary-container text-on-primary-container px-sm py-xs rounded-full border-2 border-background flex items-center gap-xs shadow-lg">
<span class="material-symbols-outlined text-[16px]" data-icon="military_tech">military_tech</span>
<span class="font-label-caps text-label-caps uppercase">PRO</span>
</div>
</div>
<div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">Marc R.</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Point Guard • 185cm</p>
</div>
</section>

<div class="bg-[#1E1E1E] rounded-lg border-t-2 border-primary-container p-md flex flex-col items-center justify-center text-center relative overflow-hidden group hover:bg-surface-container-high transition-colors">
<div class="absolute top-0 right-0 w-16 h-16 bg-primary-container opacity-10 rounded-bl-full transition-all group-hover:scale-150"></div>
<span class="font-stats-num text-stats-num text-on-background">42</span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase mt-xs">Sesiones</span>
</div>
<div class="bg-[#1E1E1E] rounded-lg border-t-2 border-tertiary-container p-md flex flex-col items-center justify-center text-center relative overflow-hidden group hover:bg-surface-container-high transition-colors">
<div class="absolute top-0 right-0 w-16 h-16 bg-tertiary-container opacity-10 rounded-bl-full transition-all group-hover:scale-150"></div>
<span class="font-stats-num text-stats-num text-on-background">64%</span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase mt-xs">% Promedio</span>
</div>
</section>

<div class="bg-[#1E1E1E] rounded-xl border border-[#333333] overflow-hidden flex flex-col divide-y divide-[#333333]">

<button class="w-full flex items-center px-md py-lg gap-md hover:bg-surface-container-high transition-colors active:scale-[0.98] duration-100 text-left">

<span class="font-body-md text-body-md text-on-background flex-1">Notificaciones</span>
<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right">chevron_right</span>
</button>

<span class="material-symbols-outlined text-on-surface-variant" data-icon="videocam">videocam</span>
<div class="flex-1 flex flex-col">
<span class="font-body-md text-body-md text-on-background">Privacidad de video</span>
<span class="font-label-caps text-label-caps text-on-surface-variant normal-case">Procesar localmente / guardar clips</span>
</div>
<!-- Custom Toggle -->

<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container border border-[#333333]"></div>
</label>
</div>

<span class="material-symbols-outlined text-on-surface-variant" data-icon="speed">speed</span>
<span class="font-body-md text-body-md text-on-background flex-1">Nivel de juego</span>
<span class="font-label-caps text-label-caps text-primary uppercase">Pro</span>
<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right">chevron_right</span>
</button>
</div>

<button class="mt-md w-full bg-[#1E1E1E] rounded-xl border border-[#333333] flex items-center justify-center px-md py-lg gap-sm hover:bg-error-container hover:border-error hover:text-error transition-colors active:scale-[0.98] duration-100 text-on-error-container group">
<span class="material-symbols-outlined transition-colors group-hover:text-error" data-icon="logout">logout</span>
<span class="font-body-lg text-body-lg font-semibold transition-colors group-hover:text-error">Cerrar sesión</span>
</button>
