<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>

<style>
        body {
            background-color: #121212;
            color: #e5e2e1;
            margin: 0;
            padding: 0;
        }
        
        .court-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1.2;
            margin: 0 auto;
            border: 2px solid #333333;
            border-radius: 4px;
            background-color: #1E1E1E;
            overflow: hidden;
        }
        
        /* Court Lines */
        .court-line {
            position: absolute;
            border: 2px solid #5a4136;
        }
        
        .three-point-arc {
            top: 20%;
            left: 5%;
            right: 5%;
            bottom: -20%;
            border-radius: 50% 50% 0 0;
            border-bottom: none;
        }
        
        .paint-area {
            top: 60%;
            left: 35%;
            right: 35%;
            bottom: 0;
            background-color: rgba(90, 65, 54, 0.2);
            border-bottom: none;
        }
        
        .free-throw-circle {
            top: 50%;
            left: 40%;
            right: 40%;
            height: 20%;
            border-radius: 50%;
        }
        
        .basket {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 8%;
            height: 8%;
            border: 2px solid #ff6b00;
            border-radius: 50%;
        }
        
        /* Selectable Zones */
        .zone {
            position: absolute;
            background-color: rgba(30, 30, 30, 0.5);
            border: 1px dashed #5a4136;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .zone:hover {
            background-color: rgba(255, 107, 0, 0.1);
        }
        
        .zone.active {
            background-color: rgba(255, 107, 0, 0.3);
            border: 2px solid #ff6b00;
        }
        
        /* Zone Layouts */
        .zone-left-corner { top: 70%; bottom: 0; left: 0; width: 15%; }
        .zone-right-corner { top: 70%; bottom: 0; right: 0; width: 15%; }
        .zone-left-wing { top: 30%; bottom: 30%; left: 0; width: 25%; }
        .zone-right-wing { top: 30%; bottom: 30%; right: 0; width: 25%; }
        .zone-top-key { top: 0; height: 30%; left: 25%; right: 25%; }
        .zone-mid-range { top: 30%; bottom: 40%; left: 25%; right: 25%; }
        
        .zone-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: rgba(229, 226, 225, 0.5);
            text-align: center;
            pointer-events: none;
        }
        
        .zone.active .zone-text {
            color: #ffb693;
            font-weight: 600;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex flex-col pb-[120px]">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface border-b border-outline-variant flex justify-between items-center px-margin-mobile py-sm z-40">
<button class="p-2 text-primary dark:text-primary active:scale-95 duration-100">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold tracking-tighter">EzyBall</h1>
<button class="p-2 text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 duration-100 rounded-full">
<span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 px-margin-mobile py-lg flex flex-col items-center">
<div class="w-full max-w-md text-center mb-md">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">Select Zone</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Tap a court area to start tracking shots.</p>
</div>
<!-- Court Graphic -->
<div class="w-full max-w-md bg-surface-container-low border border-outline-variant rounded-xl p-md mb-xl shadow-lg relative overflow-hidden">
<div class="court-container">
<!-- Lines -->
<div class="court-line three-point-arc"></div>
<div class="court-line free-throw-circle"></div>
<div class="court-line paint-area"></div>
<div class="basket"></div>
<!-- Interactive Zones -->
<div class="zone zone-left-corner" onclick="selectZone(this)">
<span class="zone-text">L. CORNER</span>
</div>
<div class="zone zone-right-corner" onclick="selectZone(this)">
<span class="zone-text">R. CORNER</span>
</div>
<div class="zone zone-left-wing" onclick="selectZone(this)">
<span class="zone-text">L. WING</span>
</div>
<div class="zone zone-right-wing active" onclick="selectZone(this)">
<span class="zone-text">R. WING</span>
</div>
<div class="zone zone-top-key" onclick="selectZone(this)">
<span class="zone-text">TOP KEY</span>
</div>
<div class="zone zone-mid-range" onclick="selectZone(this)">
<span class="zone-text">MID</span>
</div>
</div>
<!-- Contextual Settings within Card -->
<div class="mt-md flex justify-between items-center border-t border-surface-variant pt-md">
<div class="flex items-center space-x-2">
<span class="material-symbols-outlined text-on-surface-variant text-sm">settings_timelapse</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">TIMED DRILL</span>
</div>
<div class="w-12 h-6 bg-surface-container-high rounded-full relative cursor-pointer border border-outline-variant">
<div class="absolute left-1 top-1 w-4 h-4 bg-on-surface-variant rounded-full"></div>
</div>
</div>
</div>
</main>
<!-- Fixed Action Button (Contextual to this screen) -->
<div class="fixed bottom-[80px] left-0 w-full px-margin-mobile z-40">
<button class="w-full bg-[#FF6B00] text-black font-headline-md text-[18px] py-4 rounded-xl flex items-center justify-center space-x-2 active:scale-95 transition-transform duration-150 shadow-lg border border-[#a04100]">
<span class="material-symbols-outlined font-bold text-[24px]">videocam</span>
<span>Comenzar a grabar</span>
</button>
</div>
<script>
        function selectZone(element) {
            // Remove active class from all zones
            document.querySelectorAll('.zone').forEach(el => {
                el.classList.remove('active');
            });
            // Add active class to clicked zone
            element.classList.add('active');
        }
    </script>
</body></html>
