<div class="relative group">

</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full bg-surface-container-high text-on-surface border-b border-surface-container-high focus:border-primary-container focus:ring-0 pl-xl pr-sm py-md rounded-DEFAULT transition-colors outline-none font-body-md text-body-md placeholder:text-on-surface-variant" id="password" name="password" placeholder="Password" type="password"/>
</div>
<div class="flex justify-end w-full">
<a class="font-body-md text-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary-container text-[#000000] font-headline-md text-headline-md py-md rounded-DEFAULT active:scale-[0.98] transition-transform flex justify-center items-center gap-sm hover:brightness-110 shadow-[0_0_15px_rgba(255,107,0,0.3)]" type="submit">
